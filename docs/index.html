<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor przetargów Agro</title>
  <style>
    :root { --bg:#f4f6f3; --card:#fff; --text:#1c251d; --muted:#667069; --line:#dfe5df; --accent:#245b35; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
    header { background:#173e27; color:white; padding:24px max(20px,calc((100vw - 1200px)/2)); }
    header h1 { margin:0 0 6px; font-size:28px; }
    header p { margin:0; opacity:.82; }
    main { max-width:1200px; margin:auto; padding:20px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
    .stat,.panel,.results { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
    .stat { padding:16px; }
    .stat strong { display:block; font-size:26px; margin-top:6px; }
    .muted { color:var(--muted); }
    .panel { padding:14px; margin-bottom:16px; }
    .filters { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; align-items:end; }
    label { display:block; font-size:12px; font-weight:bold; color:var(--muted); margin-bottom:5px; }
    input,select,button { width:100%; min-height:40px; border:1px solid #cbd3cc; border-radius:8px; padding:8px 10px; background:white; font-size:14px; }
    button,.open-link { cursor:pointer; background:var(--accent); color:white; border:none; padding:10px 16px; font-weight:bold; border-radius:8px; text-decoration:none; display:inline-block; white-space:nowrap; }
    .results { overflow:hidden; }
    .result { display:grid; grid-template-columns:150px 1fr 125px; gap:18px; align-items:center; padding:17px 18px; border-bottom:1px solid var(--line); }
    .result:last-child { border-bottom:none; }
    .result:hover { background:#fafcfa; }
    .source { font-weight:bold; font-size:16px; }
    .title { font-weight:bold; color:#174f2d; margin-bottom:5px; line-height:1.3; }
    .meta { font-size:13px; color:var(--muted); margin-top:6px; }
    .badge { display:inline-block; border-radius:999px; padding:4px 8px; font-size:12px; font-weight:bold; background:#e6ece7; margin-bottom:6px; }
    .badge.new { background:#d9f4df; color:#145826; }
    .badge.changed { background:#fff0cc; color:#724800; }
    .error-box { margin-top:10px; }
    details { color:#7a1b1b; }
    .empty { padding:32px; text-align:center; color:var(--muted); }
    @media(max-width:800px){
      .stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters>div:first-child{grid-column:1/-1}
      .result{grid-template-columns:1fr}.open-link{width:100%;text-align:center}
    }
  </style>
</head>
<body>
<header>
  <h1>Monitor przetargów Agro</h1>
  <p>Jeden zwięzły wpis na jednostkę. Dokumenty i załączniki nie są pokazywane osobno.</p>
</header>
<main>
  <section class="stats">
    <div class="stat"><span class="muted">Jednostki z trafieniem</span><strong id="sAll">–</strong></div>
    <div class="stat"><span class="muted">Nowe/zmienione</span><strong id="sNew">–</strong></div>
    <div class="stat"><span class="muted">Źródła sprawdzone</span><strong id="sSources">–</strong></div>
    <div class="stat"><span class="muted">Błędy źródeł</span><strong id="sErrors">–</strong></div>
  </section>

  <section class="panel">
    <div class="filters">
      <div><label for="q">Szukaj</label><input id="q" placeholder="np. Lubiana, obora, magazyn"></div>
      <div><label for="change">Zmiana</label><select id="change"><option value="">Wszystkie</option><option>Nowe</option><option>Zmienione</option><option>Bez zmian</option></select></div>
      <div><label for="category">Jednostka</label><select id="category"><option value="">Wszystkie</option></select></div>
      <button id="clear">Wyczyść</button>
    </div>
    <div id="meta" class="muted" style="margin-top:12px"></div>
    <div id="errors" class="error-box"></div>
  </section>

  <section class="results" id="results"></section>
  <div id="empty" class="empty" hidden>Brak pasujących jednostek.</div>
</main>
<script>
let DATA={items:[],errors:[]};
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pl-PL'):'do sprawdzenia';
function render(){
  const q=document.querySelector('#q').value.toLowerCase().trim();
  const change=document.querySelector('#change').value;
  const category=document.querySelector('#category').value;
  const items=DATA.items.filter(x=>{
    const hay=[x.title,x.source_name,x.region,x.snippet].join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!change||x.change_type===change)&&(!category||x.source_category===category);
  });
  document.querySelector('#results').innerHTML=items.map(x=>{
    const badge=x.change_type==='Nowe'?'new':x.change_type==='Zmienione'?'changed':'';
    const count=x.match_count||1;
    return `<article class="result">
      <div>
        <span class="badge ${badge}">${esc(x.change_type||'–')}</span>
        <div class="source">${esc(x.source_name)}</div>
        <div class="meta">${esc(x.source_category||'')} · ${esc(x.region||'Polska')}</div>
      </div>
      <div>
        <div class="title">${esc(x.title)}</div>
        <div>${esc(x.snippet||'Wykryto pasujące postępowanie.')}</div>
        <div class="meta">Pasujących wpisów: ${count} · termin: ${fmt(x.deadline)}</div>
      </div>
      <a class="open-link" href="${esc(x.url)}" target="_blank" rel="noopener">Otwórz źródło</a>
    </article>`;
  }).join('');
  document.querySelector('#empty').hidden=items.length>0;
}
async function init(){
  const res=await fetch(`data.json?v=${Date.now()}`,{cache:'no-store'}); DATA=await res.json();
  document.querySelector('#sAll').textContent=DATA.items.length;
  document.querySelector('#sNew').textContent=DATA.items.filter(x=>['Nowe','Zmienione'].includes(x.change_type)).length;
  document.querySelector('#sSources').textContent=DATA.sources_checked??0;
  document.querySelector('#sErrors').textContent=(DATA.errors||[]).length;
  document.querySelector('#meta').textContent=`Ostatni skan: ${DATA.generated_at?new Date(DATA.generated_at).toLocaleString('pl-PL'):'jeszcze nie wykonano'} · jednostki z trafieniem: ${DATA.found_this_run??0}`;
  const cats=[...new Set(DATA.items.map(x=>x.source_category).filter(Boolean))].sort();
  document.querySelector('#category').innerHTML='<option value="">Wszystkie</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');
  if((DATA.errors||[]).length){
    document.querySelector('#errors').innerHTML=`<details><summary>Nie udało się sprawdzić ${(DATA.errors||[]).length} źródeł — pokaż szczegóły</summary>${DATA.errors.map(e=>`<div>${esc(e.source)}: ${esc(e.error)}</div>`).join('')}</details>`;
  }
  render();
}
['q','change','category'].forEach(id=>document.querySelector('#'+id).addEventListener('input',render));
document.querySelector('#clear').addEventListener('click',()=>{['q','change','category'].forEach(id=>document.querySelector('#'+id).value='');render();});
init().catch(e=>{document.querySelector('#meta').textContent='Nie udało się wczytać danych: '+e.message;});
</script>
</body>
</html>
