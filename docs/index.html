<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor przetargów Agro</title>
  <style>
    :root { --bg:#f4f6f3; --card:#fff; --text:#1c251d; --muted:#667069; --line:#dfe5df; --accent:#245b35; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
    header { background:#173e27; color:white; padding:22px max(18px,calc((100vw - 1240px)/2)); }
    header h1 { margin:0 0 5px; font-size:27px; }
    header p { margin:0; opacity:.84; }
    main { max-width:1240px; margin:auto; padding:18px; }
    .stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
    .stat,.panel,.results { background:var(--card); border:1px solid var(--line); border-radius:11px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
    .stat { padding:13px; }
    .stat strong { display:block; font-size:24px; margin-top:5px; }
    .muted { color:var(--muted); }
    .panel { padding:13px; margin-bottom:14px; }
    .filters { display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:9px; align-items:end; }
    label { display:block; font-size:12px; font-weight:bold; color:var(--muted); margin-bottom:5px; }
    input,select,button { width:100%; min-height:38px; border:1px solid #cbd3cc; border-radius:8px; padding:7px 9px; background:white; font-size:14px; }
    button,.open-link { cursor:pointer; background:var(--accent); color:white; border:none; padding:9px 14px; font-weight:bold; border-radius:8px; text-decoration:none; display:inline-block; white-space:nowrap; }
    .results { overflow:hidden; }
    .result { display:grid; grid-template-columns:190px 1fr 125px; gap:16px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
    .result:last-child { border-bottom:none; }
    .result:hover { background:#fafcfa; }
    .source { font-weight:bold; font-size:15px; }
    .title { font-weight:bold; color:#174f2d; margin-bottom:4px; line-height:1.28; font-size:15px; }
    .meta { font-size:12px; color:var(--muted); margin-top:5px; }
    .badge { display:inline-block; border-radius:999px; padding:3px 7px; font-size:11px; font-weight:bold; background:#e6ece7; margin-bottom:5px; }
    .badge.new { background:#d9f4df; color:#145826; }
    .badge.changed { background:#fff0cc; color:#724800; }
    .badge.open { background:#dcecff; color:#174a7a; margin-left:4px; }
    .error-summary { margin-top:9px; font-size:13px; }
    details { color:#7a1b1b; }
    details div { margin-top:4px; line-height:1.3; }
    .empty { padding:30px; text-align:center; color:var(--muted); }
    .pager { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:12px; }
    .pager button { width:auto; min-width:110px; }
    .pager button:disabled { opacity:.45; cursor:not-allowed; }
    @media(max-width:900px){
      .stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters>div:first-child{grid-column:1/-1}
      .result{grid-template-columns:1fr}.open-link{width:100%;text-align:center}
    }
  </style>
</head>
<body>
<header>
  <h1>Monitor przetargów Agro</h1>
  <p>Jeden wpis = jedno postępowanie. Załączniki, formularze i SWZ nie są osobnymi rekordami.</p>
</header>
<main>
  <section class="stats">
    <div class="stat"><span class="muted">Postępowania</span><strong id="sAll">–</strong></div>
    <div class="stat"><span class="muted">Jednostki z trafieniem</span><strong id="sUnits">–</strong></div>
    <div class="stat"><span class="muted">Otwarte</span><strong id="sOpen">–</strong></div>
    <div class="stat"><span class="muted">Źródła sprawdzone</span><strong id="sSources">–</strong></div>
    <div class="stat"><span class="muted">Błędy źródeł</span><strong id="sErrors">–</strong></div>
  </section>

  <section class="panel">
    <div class="filters">
      <div><label for="q">Szukaj</label><input id="q" placeholder="np. Lubiana, obora, magazyn"></div>
      <div><label for="status">Status</label><select id="status"><option value="">Wszystkie</option><option>Otwarty</option><option>Do sprawdzenia</option></select></div>
      <div><label for="change">Zmiana</label><select id="change"><option value="">Wszystkie</option><option>Nowe</option><option>Zmienione</option><option>Bez zmian</option></select></div>
      <div><label for="category">Jednostka</label><select id="category"><option value="">Wszystkie</option></select></div>
      <button id="clear">Wyczyść</button>
    </div>
    <div id="meta" class="muted" style="margin-top:11px"></div>
    <div id="errors" class="error-summary"></div>
  </section>

  <section class="results" id="results"></section>
  <div id="empty" class="empty" hidden>Brak pasujących postępowań.</div>

  <div class="pager">
    <button id="prev">← Poprzednia</button>
    <span id="pageInfo" class="muted"></span>
    <button id="next">Następna →</button>
  </div>
</main>
<script>
let DATA={items:[],errors:[]};
let page=1;
const PAGE_SIZE=20;
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pl-PL'):'do sprawdzenia';

function filteredItems(){
  const q=document.querySelector('#q').value.toLowerCase().trim();
  const status=document.querySelector('#status').value;
  const change=document.querySelector('#change').value;
  const category=document.querySelector('#category').value;
  return DATA.items.filter(x=>{
    const hay=[x.title,x.source_name,x.region,x.snippet,(x.matched_keywords||[]).join(' ')].join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!status||x.status===status)&&(!change||x.change_type===change)&&(!category||x.source_category===category);
  });
}

function render(){
  const all=filteredItems();
  const pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));
  if(page>pages) page=pages;
  const start=(page-1)*PAGE_SIZE;
  const items=all.slice(start,start+PAGE_SIZE);

  document.querySelector('#results').innerHTML=items.map(x=>{
    const badge=x.change_type==='Nowe'?'new':x.change_type==='Zmienione'?'changed':'';
    const statusBadge=x.status==='Otwarty'?'<span class="badge open">Otwarty</span>':'';
    return `<article class="result">
      <div>
        <span class="badge ${badge}">${esc(x.change_type||'–')}</span>${statusBadge}
        <div class="source">${esc(x.source_name)}</div>
        <div class="meta">${esc(x.source_category||'')} · ${esc(x.region||'Polska')}</div>
      </div>
      <div>
        <div class="title">${esc(x.title)}</div>
        <div class="meta">Publikacja: ${fmt(x.published_date)} · termin ofert: ${fmt(x.deadline)}</div>
      </div>
      <a class="open-link" href="${esc(x.url)}" target="_blank" rel="noopener">Otwórz</a>
    </article>`;
  }).join('');

  document.querySelector('#empty').hidden=items.length>0;
  document.querySelector('#pageInfo').textContent=`Wyniki ${all.length?start+1:0}–${Math.min(start+PAGE_SIZE,all.length)} z ${all.length} · strona ${page}/${pages}`;
  document.querySelector('#prev').disabled=page<=1;
  document.querySelector('#next').disabled=page>=pages;
}

async function init(){
  const res=await fetch(`data.json?v=${Date.now()}`,{cache:'no-store'});
  DATA=await res.json();
  const units=DATA.units_with_hits??new Set(DATA.items.map(x=>x.source_name)).size;
  const open=DATA.items.filter(x=>x.status==='Otwarty').length;

  document.querySelector('#sAll').textContent=DATA.items.length;
  document.querySelector('#sUnits').textContent=units;
  document.querySelector('#sOpen').textContent=open;
  document.querySelector('#sSources').textContent=DATA.sources_checked??0;
  document.querySelector('#sErrors').textContent=(DATA.errors||[]).length;
  document.querySelector('#meta').textContent=`Ostatni skan: ${DATA.generated_at?new Date(DATA.generated_at).toLocaleString('pl-PL'):'jeszcze nie wykonano'} · nowe/zmienione: ${DATA.new_or_changed??0}`;

  const cats=[...new Set(DATA.items.map(x=>x.source_category).filter(Boolean))].sort();
  document.querySelector('#category').innerHTML='<option value="">Wszystkie</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');

  if((DATA.errors||[]).length){
    document.querySelector('#errors').innerHTML=`<details><summary>${(DATA.errors||[]).length} źródeł nie udało się sprawdzić — kliknij tylko wtedy, gdy chcesz zobaczyć listę</summary>${DATA.errors.map(e=>`<div><strong>${esc(e.source)}</strong></div>`).join('')}</details>`;
  }
  render();
}

['q','status','change','category'].forEach(id=>document.querySelector('#'+id).addEventListener('input',()=>{page=1;render();}));
document.querySelector('#clear').addEventListener('click',()=>{['q','status','change','category'].forEach(id=>document.querySelector('#'+id).value='');page=1;render();});
document.querySelector('#prev').addEventListener('click',()=>{if(page>1){page--;render();window.scrollTo({top:0,behavior:'smooth'});}});
document.querySelector('#next').addEventListener('click',()=>{const pages=Math.max(1,Math.ceil(filteredItems().length/PAGE_SIZE));if(page<pages){page++;render();window.scrollTo({top:0,behavior:'smooth'});}});
init().catch(e=>{document.querySelector('#meta').textContent='Nie udało się wczytać danych: '+e.message;});
</script>
</body>
</html>
